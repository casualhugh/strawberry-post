name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check platformio==6.2.0 -r requirements-dev.txt

      - name: Test web preview
        run: python -m unittest discover -s test/tools -v

      - name: Test native C++ code
        run: pio test --environment native

      - name: Build ESP32-S3 firmware
        run: pio run --environment esp32s3

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: strawberry-post-firmware-${{ github.sha }}
          path: .pio/build/esp32s3/firmware.bin
          if-no-files-found: error
          retention-days: 14
