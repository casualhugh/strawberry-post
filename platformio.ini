; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
# Keep builds reproducible across machines by using the version verified by
# the native and ESP32-S3 test suite.
platform = espressif32@7.0.1
; Project-owned definition for the CrowPanel's ESP32-S3-WROOM-1-N8R8:
; 8 MB QSPI flash, 8 MB octal-SPI PSRAM, and UART upload via its USB bridge.
board = crowpanel_579_epaper
framework = arduino
board_build.filesystem = littlefs
extra_scripts = pre:tools/generate_web_assets.py

[env:native]
platform = native@1.2.1
test_framework = unity
test_filter = native/*
build_flags =
  -std=gnu++11
  -Wall
  -Wextra
  -Wpedantic
